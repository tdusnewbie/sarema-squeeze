# sarema-squeeze CI — test, build, push Docker image, update homelab GitOps
when:
  - event: push
    branch: main
  - event: manual

steps:
  - name: test
    image: git.local.tdusnewbie.com/tdusnewbie/plugin-test-python:v0.0.1
    pull: true
    settings:
      test_path: tests/
      coverage: true
      coverage_threshold: 80

  - name: build-push
    image: git.local.tdusnewbie.com/tdusnewbie/plugin-build-push:v0.0.1
    pull: true
    settings:
      registry: git.local.tdusnewbie.com
      repo: tdusnewbie/sarema-squeeze
      tags: latest,sha-${CI_COMMIT_SHA}
      username:
        from_secret: forgejo_username
      password:
        from_secret: forgejo_token

  - name: gitops-update
    image: git.local.tdusnewbie.com/tdusnewbie/plugin-gitops-update:v0.0.1
    pull: true
    settings:
      homelab_repo_url: https://git.local.tdusnewbie.com/tdusnewbie/homelab.git
      values_file: k8s/apps/sarema-squeeze/values.yaml
      app_name: sarema-squeeze
      image_tag: sha-${CI_COMMIT_SHA}
      git_username:
        from_secret: forgejo_username
      git_token:
        from_secret: forgejo_token
