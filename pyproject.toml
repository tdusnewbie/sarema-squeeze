[project]
name = "sarema-squeeze"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "ccxt>=4.5.45",
    "duckdb>=1.5.1",
    "pandas>=2.2.2",
    "numpy>=1.26.0,<2.4",
    "pydantic>=2.12.5",
    "pytest>=9.0.2",
    "pytest-mock>=3.15.1",
    "pytest-asyncio>=0.23.5",
    "python-dotenv>=1.2.2",
    "python-telegram-bot[job-queue]>=22.7",
    "ta-lib>=0.6.8",
    "typer[all]>=0.24.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "--cov=src --cov-report=term-missing --cov-fail-under=80"

[tool.coverage.run]
source = ["src"]
omit = [
    "src/bot.py",           # CLI entrypoint — requires live Typer/env context
    "src/telegram_bot.py",  # Telegram command handlers — requires live bot token
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]

[dependency-groups]
dev = [
    "pytest-cov>=7.1.0",
]
